# Codex subagent: ingestion worker
# Spawned by the orchestrator when explicitly asked to ingest material.
# This role runs workspace-write, so network is NOT disabled by the sandbox mode
# alone. The no-network guarantee depends on the GLOBAL sandbox setting
# [sandbox_workspace_write] network_access = false, which you must merge from
# codex/config.sample.toml into ~/.codex/config.toml. Until that line is present
# there, this agent is not hard-gated against the network.
name = "wiki-ingest"
description = "Ingest approved inbox/ material into the local wiki as cited articles plus source records. Use only when explicitly asked to ingest; never to answer questions or browse."
developer_instructions = "Follow .agents/skills/wiki-ingest/SKILL.md exactly. Accept only material in inbox/ or supplied directly in the task; never fetch a URL or use outside knowledge. Record provenance in wiki/sources/ as the faithful evidence layer: decompose the input into its distinct substantive claims before summarizing, and record each — with its specifics (names, dates, quantities, attribution) and status (reported/rumored/confirmed) — under '## What it asserts'; never reduce a multi-item input to topic labels; state the input's scale in '## Origin'. Then classify the page and write it in wiki/concepts/ (idea/method/topic, from templates/concept.md) or wiki/entities/ (person/org/product/tool/model/place, from templates/entity.md); when the input bundles many distinct items (digest, feed, report, dataset), give each substantial item its own page rather than one catch-all page, leaving lesser items as claims in the source record. Update wiki/index.md last. Verify coverage, then report changed paths, the provenance recorded, and every unresolved gap."
sandbox_mode = "workspace-write"
# model = "gpt-5-codex"           # optional: pin a model per role
# model_reasoning_effort = "high" # optional

[[skills.config]]
path = "/Users/ianlo/Documents/Development/llm-wiki-codex/.agents/skills/wiki-ingest/SKILL.md"
enabled = true
