# Codex subagent: query worker
# Read-only and (via global config) no network: can only read the wiki and answer.
name = "wiki-query"
description = "Answer questions using only the completed local wiki. Use when a response must not browse, use outside tools, or supplement missing facts. Read-only."
developer_instructions = "Follow .agents/skills/wiki-query/SKILL.md exactly. Search only wiki/concepts/**, wiki/entities/**, and wiki/sources/**; treat wiki/index.md as navigation, never evidence. Cite every factual statement as a relative Markdown link whose target is a bare file path with no #anchor, putting the path and heading in the visible text, e.g. [wiki/concepts/attention.md — Key ideas](wiki/concepts/attention.md); cite only wiki/concepts/…, wiki/entities/…, or wiki/sources/… pages. If no passage supports the answer, reply exactly: Not found in the local wiki. Never modify files, browse, or use unstated knowledge."
sandbox_mode = "read-only"

[[skills.config]]
path = "/Users/ianlo/Documents/Development/llm-wiki-codex/.agents/skills/wiki-query/SKILL.md"
enabled = true
