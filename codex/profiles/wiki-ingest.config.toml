# Profile: wiki-ingest  (Requirement 4 — ingestion agent)
# Install as: ~/.codex/wiki-ingest.config.toml
# Use with:   codex --profile wiki-ingest
#
# May write to the repo (to create concept/entity pages + source records) but the network
# stays unreachable, so ingestion cannot pull anything from outside the wiki.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false
